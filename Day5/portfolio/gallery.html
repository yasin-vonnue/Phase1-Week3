<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Image Gallery | Marvel Studios</title>

    <meta
      name="description"
      content="Explore the Marvel Studios image gallery."
    />

    <meta property="og:title" content="Image Gallery | Marvel Studios" />
    <meta
      property="og:description"
      content="Explore the Marvel Studios image gallery."
    />
    <meta property="og:image" content="./images/hero.webp" />
    <meta
      property="og:url"
      content="https://www.marvelstudios.com/gallery.html"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marvel Studios" />

    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <div class="reading-progress" aria-hidden="true"></div>
    <header>
      <h1>Marvel Studios Pvt. Ltd.</h1>

      <h2 class="page-title">Image Gallery</h2>

      <nav class="navbar" aria-label="Main navigation">
        <div class="logo">
          <a href="./index.html" aria-label="Marvel Studios home">
            <img src="./images/marvel-logo.svg" alt="Marvel Studios logo" />
          </a>
        </div>

        <button
          type="button"
          class="menu-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="main-navigation"
        >
          &#9776;
        </button>

        <div class="navlinks" id="main-navigation">
          <button
            type="button"
            class="menu-close"
            aria-label="Close navigation menu"
          >
            &#10005;
          </button>

          <a href="./index.html">Home</a>
          <a href="./about.html">About</a>
          <a href="./team.html">Team</a>
          <a href="./services.html">Services</a>
          <a href="./gallery.html" aria-current="page">Gallery</a>
          <a href="./contact.html">Contact Us</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="gallery-section" aria-labelledby="gallery-title">
        <h2 id="gallery-title" class="scroll-animate">Image Gallery</h2>

        <div class="gallery">
          <img
            src="https://picsum.photos/id/237/200/300"
            alt="Gallery image 1"
            loading="lazy"
          />

          <img
            src="https://picsum.photos/id/238/200/300"
            alt="Gallery image 2"
            loading="lazy"
          />

          <img
            src="https://picsum.photos/id/239/200/300"
            alt="Gallery image 3"
            loading="lazy"
          />

          <img
            src="https://picsum.photos/id/240/200/300"
            alt="Gallery image 4"
            loading="lazy"
          />

          <img
            src="https://picsum.photos/id/241/200/300"
            alt="Gallery image 5"
            loading="lazy"
          />

          <img
            src="https://picsum.photos/id/242/200/300"
            alt="Gallery image 6"
            loading="lazy"
          />
        </div>
      </section>
    </main>

    <div
      class="lightbox hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-label="Image preview"
    >
      <button type="button" class="prev" aria-label="Previous image">
        &#10094;
      </button>

      <img src="" alt="" class="lightbox-image" />

      <button type="button" class="next" aria-label="Next image">
        &#10095;
      </button>

      <button type="button" class="close" aria-label="Close image preview">
        &#10006;
      </button>
    </div>

    <footer>
      <p>&copy; 2026 Marvel Studios. All Rights Reserved.</p>
    </footer>

    <button type="button" class="back-to-top" aria-label="Back to top" hidden>
      &#8593;
    </button>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
