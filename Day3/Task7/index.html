<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="board">
      <div class="column" data-column="todo">
        <h2>To Do</h2>

        <form data-column="todo">
          <input placeholder="New card" />
          <button type="submit">Add</button>
        </form>

        <div class="cards"></div>
      </div>

      <div class="column" data-column="progress">
        <h2>In Progress</h2>

        <form data-column="progress">
          <input placeholder="New card" />
          <button type="submit">Add</button>
        </form>

        <div class="cards"></div>
      </div>

      <div class="column" data-column="done">
        <h2>Done</h2>

        <form data-column="done">
          <input placeholder="New card" />
          <button type="submit">Add</button>
        </form>

        <div class="cards"></div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
