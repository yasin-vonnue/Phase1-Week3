<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
  </head>
  <body>
    <h2>Shopping Cart</h2>

    <div id="cart"></div>

    <button id="add">Add Apple</button>

    <button id="remove">Remove Apple</button>

    <label
      >Quantity:
      <input type="number" id="qty" value="1" min="1" />
    </label>

    <button id="update">Update Quantity</button>

    <label>
      Coupon (%):
      <input type="number" id="coupon" value="10" min="0" max="100" />
    </label>

    <button id="applyCoupon">Apply Coupon</button>

    <button id="undo">Undo</button>

    <script src="main.js"></script>
  </body>
</html>
